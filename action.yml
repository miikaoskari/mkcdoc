name: 'mkcdoc'
description: 'Generate a static docs site from Doxygen-style C comments and hand-written Markdown'
author: 'miikaoskari'
branding:
  icon: 'book-open'
  color: 'blue'

inputs:
  config:
    description: 'Path to mkcdoc.toml, relative to the repository root'
    required: false
    default: 'mkcdoc.toml'

runs:
  using: 'docker'
  image: 'docker://ghcr.io/miikaoskari/mkcdoc@sha256:e4a9f726d60265bc4ea004ffb09fe34ab853ede32a361f1978326ddc9fe2bb03'
  args:
    - 'build'
    - '--config'
    - '${{ inputs.config }}'
